<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <script src="https://cdn.tailwindcss.com"></script>

    <script src="scripts/configs/chat-config.js"></script>
    <script src="scripts/configs/student-information-chat-config.js"></script>
    <script src="scripts/chat-manager.js"></script>

    <link rel="stylesheet"
          href="css-files/home-student.css">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body class="bg-black overflow-hidden">

<section class="h-screen flex bg-black">

    <!-- LEFT -->
    <div class="w-[350px] border-r border-white/10 bg-white/5 flex flex-col">

        <!-- top -->
        <div class="p-6 border-b border-white/10">

            <h2 class="text-white text-5xl font-black">
                Chats
            </h2>

            <!-- search -->
            <div class="mt-5 flex items-center bg-white/10 rounded-full px-4 py-3">

                <i class="fa-solid fa-magnifying-glass text-gray-400"></i>

                <input id="chat-search"
                       type="text"
                       placeholder="Search..."
                       oninput="searchChats()"
                       class="bg-transparent outline-none text-white placeholder-gray-400 ml-3 w-full">

            </div>

        </div>

        <!-- chat list -->
        <div id="chat-list"
             class="flex-1 overflow-y-auto">
        </div>

    </div>





    <!-- RIGHT -->
    <div id="right-chat"
         class="flex flex-1 flex-col h-screen bg-black">

        <!-- HEADER -->
        <div class="h-[90px] border-b border-white/10 bg-white/5 px-8 flex items-center justify-between">

            <div class="flex items-center gap-4">

                <img src="images/home_social_1.jpg"
                     class="w-14 h-14 rounded-full object-cover">

                <div>

                    <h3 id="chat-name"
                        class="text-white font-bold text-2xl">
                        Student
                    </h3>

                    <p class="text-green-400">
                        Online
                    </p>

                </div>

            </div>

        </div>





        <!-- GOALS -->
        <div class="border-b border-white/10 bg-white/5">

            <!-- top -->
            <div onclick="toggleGoals()"
                 class="px-8 py-5 flex items-center justify-between cursor-pointer">

                <div class="flex items-center gap-4">

                    <h2 class="text-white text-3xl font-bold">
                        Learning Goals
                    </h2>

                    <span class="text-blue-400 text-xl font-bold">
                        View Only
                    </span>

                </div>

                <i id="goal-arrow"
                   class="fa-solid fa-chevron-down text-white text-xl transition duration-300">
                </i>

            </div>





            <!-- content -->
            <div id="goal-content"
                 class="px-8 pb-6">

                <!-- progress -->
                <div class="w-full h-3 bg-white/10 rounded-full overflow-hidden mb-6">

                    <div class="h-full bg-blue-500"
                         style="width: 65%">
                    </div>

                </div>





                <!-- tasks -->
                <div class="space-y-4">

                    <!-- disabled -->
                    <label class="flex items-center gap-4 bg-white/5 p-4 rounded-2xl opacity-80">

                        <input type="checkbox"
                               checked
                               disabled
                               class="w-5 h-5 accent-blue-500 cursor-not-allowed">

                        <span class="text-white text-xl">
                            Finish CV
                        </span>

                    </label>





                    <label class="flex items-center gap-4 bg-white/5 p-4 rounded-2xl opacity-80">

                        <input type="checkbox"
                               checked
                               disabled
                               class="w-5 h-5 accent-blue-500 cursor-not-allowed">

                        <span class="text-white text-xl">
                            Practice IELTS Speaking
                        </span>

                    </label>





                    <label class="flex items-center gap-4 bg-white/5 p-4 rounded-2xl opacity-80">

                        <input type="checkbox"
                               disabled
                               class="w-5 h-5 accent-blue-500 cursor-not-allowed">

                        <span class="text-white text-xl">
                            Complete Portfolio
                        </span>

                    </label>

                </div>

            </div>

        </div>





        <!-- MESSAGES -->
        <div id="chat-messages"
             class="flex-1 overflow-y-auto px-8 py-6 space-y-4">

            <div class="bg-blue-500 text-white w-fit max-w-[70%] px-5 py-3 rounded-2xl">
                Hello! How can I help you today?
            </div>

        </div>





        <!-- INPUT -->
        <div class="p-6 border-t border-white/10 bg-white/5">

            <div class="flex items-center gap-4">

                <input id="message-input"
                       type="text"
                       placeholder="Type a message..."
                       class="flex-1 bg-white/10 rounded-full px-6 py-4 text-white outline-none">

                <button onclick="sendMessage()"
                        class="w-14 h-14 rounded-full bg-blue-500 text-white text-xl hover:scale-105 transition">

                    <i class="fa-solid fa-paper-plane"></i>

                </button>

            </div>

        </div>

    </div>

</section>





<script>

    // ===== TOGGLE GOALS =====

    function toggleGoals() {

        const content =
            document.getElementById("goal-content");

        const arrow =
            document.getElementById("goal-arrow");

        content.classList.toggle("hidden");

        arrow.classList.toggle("rotate-180");
    }





    // ===== SEND MESSAGE =====

    function sendMessage() {

        const input =
            document.getElementById("message-input");

        const messages =
            document.getElementById("chat-messages");

        const text =
            input.value.trim();

        if(text === "") return;

        const message =
            document.createElement("div");

        message.className =
            "bg-white/10 text-white ml-auto w-fit max-w-[70%] px-5 py-3 rounded-2xl";

        message.innerText = text;

        messages.appendChild(message);

        messages.scrollTop =
            messages.scrollHeight;

        input.value = "";
    }





    // ===== ENTER SEND =====

    document
        .getElementById("message-input")
        .addEventListener("keydown", function(e) {

            if(e.key === "Enter") {

                sendMessage();

            }

        });





    renderChats();

</script>

</body>
</html>

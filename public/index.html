<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="../scripts/configs/home-bg-grid-images-config.js"></script>
  <script src="../scripts/configs/home-ratings-config.js"></script>
  <script src="../scripts/configs/home-nav-items-config.js"></script>
  <script src="../scripts/configs/auth-config.js"></script>
  <script src="../scripts/home.js"></script>
  <script src="../scripts/login.js"></script>
  <script src="../scripts/nav-items.js"></script>
  <link rel="stylesheet" href="css-files/index.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body class="bg-black overflow-x-hidden">
<section class="relative h-screen overflow-hidden bg-black">
    <nav class="fixed top-0 left-0 w-full z-30 px-10 py-6 flex items-center justify-between">
        <div class="flex items-center gap-10">
            <div class="flex items-center gap-2">
                <img src="images/logo.png" class="w-10 h-10 object-contain">
            </div>
            <div id="nav-items" class="flex items-center gap-8"></div>
        </div>
        <button onclick="openLoginModal()" class="bg-white text-black px-6 py-3 rounded-full font-bold hover:scale-105 transition">
            Đăng nhập
        </button>
    </nav>

    <img src="images/bg.jpg" class="absolute inset-0 w-full h-full object-cover">
    <div class="absolute inset-0 bg-black/55"></div>
    <div class="absolute inset-0 backdrop-blur-md bg-white/5"></div>
    <div id="bg-grid" class="absolute inset-0 grid grid-cols-4 gap-6 p-10 rotate-[-8deg] scale-110 opacity-70"></div>
    <div class="relative z-20 h-full flex flex-col items-center justify-center text-center">
        <h1 class="text-white text-7xl font-black">Mentor Connect</h1>
        <button class="mt-8 px-8 py-4 rounded-full bg-pink-500 text-white font-bold">Tạo tài khoản</button>
    </div>
</section>

<section class="bg-black py-20 px-10">
    <h2 class="text-white text-5xl font-black text-center mb-14">
        Rating
    </h2>
    <div id="rating-list" class="grid grid-cols-1 md:grid-cols-5 gap-6"></div>
</section>

<footer class="bg-black border-t border-white/10 py-10 px-10">
    <div class="flex flex-col md:flex-row items-center justify-between gap-6">
        <div>
            <h3 class="text-white text-2xl font-black">Mentor Connect</h3>
            <p class="text-gray-500 mt-2 text-sm">Kết nối mentor và student dễ dàng hơn.</p>
        </div>

        <div class="flex gap-6 text-sm">
            <a href="#" class="text-gray-400 hover:text-white transition">Giới thiệu</a>
            <a href="#" class="text-gray-400 hover:text-white transition">Hỗ trợ</a>
            <a href="#" class="text-gray-400 hover:text-white transition">Chính sách</a>
        </div>

        <div class="flex gap-4 text-xl">
            <a href="#" class="text-gray-400 hover:text-pink-400 transition">
                <i class="fab fa-facebook"></i>
            </a>
            <a href="#" class="text-gray-400 hover:text-pink-400 transition">
                <i class="fab fa-instagram"></i>
            </a>
            <a href="#" class="text-gray-400 hover:text-pink-400 transition">
                <i class="fab fa-discord"></i>
            </a>
        </div>
    </div>

    <div class="text-center text-gray-600 text-sm mt-10">
        © 2026 Mentor Connect. All rights reserved.
    </div>
</footer>

<!-- login modal -->
<div id="login-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden items-center justify-center">
    <div class="w-full max-w-md bg-zinc-900 border border-white/10 rounded-[2rem] p-8 shadow-2xl relative">
        <button onclick="closeLoginModal()" class="absolute top-5 right-5 text-gray-400 hover:text-white text-xl">
            ✕
        </button>

        <div class="text-center mb-8">
            <h2 class="text-white text-4xl font-black">
                Đăng nhập
            </h2>
            <p class="text-gray-400 mt-3">
                Chào mừng quay trở lại Mentor Connect
            </p>
        </div>

        <form onsubmit="handleLogin(event)" class="space-y-5">
            <input id="login-email" type="email" placeholder="Email" class="w-full bg-zinc-800 border border-white/10 rounded-2xl px-5 py-4 text-white outline-none focus:border-pink-500">
            <div class="relative">
                <input id="login-password" type="password" placeholder="Mật khẩu" class="w-full bg-zinc-800 border border-white/10 rounded-2xl px-5 py-4 pr-14 text-white outline-none focus:border-pink-500">
                <button type="button" onclick="togglePassword()" class="absolute right-5 top-1/2 -translate-y-1/2 text-gray-400 hover:text-white">
                    <i id="eye-icon" class="fa-solid fa-eye"></i>
                </button>
            </div>
            <button type="submit" class="w-full bg-pink-500 hover:bg-pink-600 transition rounded-2xl py-4 text-white font-bold">
                Đăng nhập
            </button>
        </form>

        <p class="text-gray-500 text-sm text-center mt-6">
            Chưa có tài khoản?
            <span class="text-pink-400 cursor-pointer hover:underline">
                Đăng ký
            </span>
        </p>
    </div>
</div>
<script>
    renderImages();
    renderRatings();
    renderNavbar();
</script>
</body>
</html>
